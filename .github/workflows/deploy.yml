name: Acme portal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: csp-acme-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build public Datadog demo
        run: pnpm build:datadog-demo
        env:
          CSP_BASE_PATH: /${{ github.event.repository.name }}/datadog/
          CSP_DOMAIN: https://${{ github.repository_owner }}.github.io
          CSP_API_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/datadog/demo-api
      - uses: actions/upload-artifact@v4
        with:
          name: datadog-frontend
          path: .csp/datadog-demo/dist
          if-no-files-found: error
          include-hidden-files: true
  portal:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CSP_BASE_PATH: /${{ github.event.repository.name }}/
      CSP_DOMAIN: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec csp validate --config portal.support.json --production
      - run: pnpm exec csp build --config portal.support.json --production
      - name: Build support API image
        run: node scripts/build-api-image.mjs portal.support.json customer-api api-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: api-image
          path: api-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: customer-frontend
          path: dist
  datadog:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:datadog-hosted
      - uses: actions/upload-artifact@v4
        with:
          name: datadog-live-frontend
          path: dist
      - name: Build separate Datadog API image
        run: node scripts/build-api-image.mjs portal.datadog-hosted.json datadog-api datadog-api-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: datadog-api-image
          path: datadog-api-image.tar
  pages:
    needs: [check, portal, datadog]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: customer-frontend
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: datadog-frontend
          path: site/datadog
      - uses: actions/download-artifact@v4
        with:
          name: datadog-live-frontend
          path: site/datadog-live
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
  image:
    needs: portal
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish customer API image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-api
          REVISION: ${{ github.sha }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker load -i api-image.tar
          printf 'FROM customer-api\n' | docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$IMAGE:$REVISION" -
          docker push "$IMAGE:$REVISION"
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            docker tag "$IMAGE:$REVISION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
  datadog-image:
    needs: datadog
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: datadog-api-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish separate Datadog API image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-datadog-api
          REVISION: ${{ github.sha }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker load -i datadog-api-image.tar
          printf 'FROM datadog-api\n' | docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$IMAGE:$REVISION" -
          docker push "$IMAGE:$REVISION"
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            docker tag "$IMAGE:$REVISION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
