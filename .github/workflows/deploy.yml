name: Acme portal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: csp-acme-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  portal:
    needs: check
    uses: kieksme/csp/.github/workflows/customer-build.yml@v0.7.0
    with:
      config: portal.hosted.json
      pages: true
      public-overrides: >-
        {"CSP_BASE_PATH":"/${{ github.event.repository.name }}/","CSP_DOMAIN":"https://${{ github.repository_owner }}.github.io"}
  image:
    needs: portal
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish customer API image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-api
          REVISION: ${{ github.sha }}
          SOURCE: https://github.com/${{ github.repository }}
        run: |
          docker load -i api-image.tar
          printf 'FROM customer-api\n' | docker build \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$IMAGE:$REVISION" -
          docker push "$IMAGE:$REVISION"
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            docker tag "$IMAGE:$REVISION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
