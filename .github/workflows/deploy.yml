name: Acme portal
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: csp-acme-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
  portal:
    needs: check
    uses: kieksme/csp/.github/workflows/customer-build.yml@c1a2bad63169ed3712bb1848555023b4f066ecfa
    with:
      config: portal.demo.json
      pages: true
      public-overrides: >-
        {"CSP_BASE_PATH":"/${{ github.event.repository.name }}/","CSP_DOMAIN":"https://${{ github.repository_owner }}.github.io","CSP_API_URL":"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/demo-api"}
